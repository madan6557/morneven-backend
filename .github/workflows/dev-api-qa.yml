name: Development API QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Development API base URL"
        required: true
        default: "https://backend.dev.morneven.com"
      scope:
        description: "QA scope"
        required: true
        type: choice
        default: "full"
        options:
          - smoke
          - full
      allow_destructive_cleanup:
        description: "Allow cleanup DELETE calls for QA-owned records"
        required: true
        type: boolean
        default: true
      include_global_state:
        description: "Include map/settings style global-state tests with rollback"
        required: true
        type: boolean
        default: false
      include_file_upload:
        description: "Include small multipart upload test"
        required: true
        type: boolean
        default: true
      include_extraction:
        description: "Include extraction job test"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev-api-qa:
    name: Run development API QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      QA_BASE_URL: ${{ inputs.base_url }}
      QA_SCOPE: ${{ inputs.scope }}
      QA_ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive_cleanup }}
      QA_INCLUDE_GLOBAL_STATE: ${{ inputs.include_global_state }}
      QA_INCLUDE_FILE_UPLOAD: ${{ inputs.include_file_upload }}
      QA_INCLUDE_EXTRACTION: ${{ inputs.include_extraction }}
      QA_RUN_ID: QA-${{ github.run_id }}-${{ github.run_attempt }}
      QA_OUTPUT_DIR: qa/reports
      QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD || 'SeedPassword123' }}
      QA_AUTHOR_EMAIL: ${{ vars.QA_AUTHOR_EMAIL || 'author@morneven.com' }}
      QA_GUEST_EMAIL: ${{ vars.QA_GUEST_EMAIL || 'guest@morneven.com' }}
      QA_EXEC7_EMAIL: ${{ vars.QA_EXEC7_EMAIL || 'author@morneven.com' }}
      QA_EXEC6_EMAIL: ${{ vars.QA_EXEC6_EMAIL || 'v.kessler@morneven.com' }}
      QA_FIELD5_EMAIL: ${{ vars.QA_FIELD5_EMAIL || 'm.varga@morneven.com' }}

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Align QA runner with development seed data
        run: |
          perl -0pi -e 's/exec6\@morneven\.com/v.kessler\@morneven.com/g; s/field5\@morneven\.com/m.varga\@morneven.com/g; s/Create DM with field5/Create DM with m.varga/g; s/body: \{ username: "field5" \}/body: { username: "m.varga" }/g; s/invitees: \["field5", "mech4"\]/invitees: ["m.varga", "s.okafor"]/g; s/username: "field5",/username: "t.bremmer",/g; s/sender: "exec7"/sender: "author"/g' qa/dev-api-qa.mjs
          node --check qa/dev-api-qa.mjs

      - name: Verify connectivity
        run: |
          curl -i --max-time 30 "$QA_BASE_URL/ready"

      - name: Run API QA
        run: |
          node qa/dev-api-qa.mjs

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-api-qa-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/
          if-no-files-found: warn
